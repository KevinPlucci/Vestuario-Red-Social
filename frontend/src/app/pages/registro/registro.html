<div class="tarjeta ancho-mediano">
  <div class="cabecera-pagina">
    <h1>Crear cuenta</h1>
    <p class="texto-suave">
      Completá tus datos para sumarte al vestuario. Todos los campos son obligatorios, salvo la
      imagen de perfil y el club: si elegís uno, de fondo vas a ver la cancha donde juega.
    </p>
  </div>

  <app-formulario-cuenta
    [enviando]="enviando()"
    (enviar)="registrar($event)"
    (clubElegido)="fondo.mostrar($event)"
  />

  <p class="pie-tarjeta texto-suave">¿Ya tenés cuenta? <a routerLink="/login">Ingresá</a></p>
</div>
